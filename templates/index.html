<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deba Age Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            width: 320px;
            box-shadow: 0 10px 30px #33333340;
        }

        h1 {
            color: #764ba2;
        }

        p {
            color: #555;
        }

        input {
            padding: 12px;
            width: 90%;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #764ba2;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #5a3685;
        }

        h2 {
            color: #667eea;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Deba Age Calculator</h1>

        <p>Find your age in seconds!</p>

        <form method="POST">
            <input
                type="number"
                name="birth_year"
                placeholder="Enter your birth year"
                min="1900"
                max="2026"
                required
            >

            <br>

            <button type="submit">Calculate Age</button>
        </form>

        {% if age is not none %}
            <h2>Your Age: {{ age }} Years</h2>
        {% endif %}

        <p>Made by Deba ❤️</p>

    </div>

</body>
</html>
